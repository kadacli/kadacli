---
name: Go

on:
  push:
    branches: ["dev", "feat/*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Build
        run: go build -v -o bin/lingon .

      - name: Test
        run: echo "TODO add tests"
        # run: go test -v ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-policy-as-code
          path: bin/lingon

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Build
        run: go build -v -o bin/lingon .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/lingon
