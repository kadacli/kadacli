---
###### This file is an example used for building the parser

apiVersion: backupctl/v1
kind: backupPolicy
metadata:
  name: production-vms
  environment: prod
  owner: you@company.com
spec:
  targets:
    - type: azure_vm
      selectors:
        - resource_group: rg-production
        - resource_name: dev_vm-prod
    - type: azure_app_service
      selectors:
        - resource_group: rg_test
        - resource_name: wordpress-test
  schedule:
    full:
      cron: "0 2 * * 0"
    incremental:
      cron: "0 2 * * 1-6"
  timezone: "Europe/Copenhagen"
  retention:
    daily: 7
    weekly: 4
    monthly: 12
  storage:
    - primary:
        provider: azure
        vault: backup-vault-prod
        redundancy: GRS
    - secondary:
        provider: aws
        vault: backup-s3-prod
        redundancy: one-dc
