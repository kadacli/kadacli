---
###### This file is an example used for building the parser

apiVersion: backupctl/v1
kind: backupPolicy
metadata:
  name: staging-databases
  environment: staging
  owner: devops@company.com
spec:
  targets:
    - type: azure_sql
      selectors:
        - resource_group: rg-staging
        - resource_name: sqldb-staging-01
    - type: azure_blob_storage
      selectors:
        - resource_group: rg-staging
        - resource_name: blobstorage-staging
  schedule:
    full:
      cron: "0 3 * * 0"
    incremental:
      cron: "0 3 * * 1-6"
  timezone: "Europe/Berlin"
  retention:
    daily: 5
    weekly: 3
    monthly: 6
  storage:
    - primary:
        provider: azure
        vault: backup-vault-staging
        redundancy: LRS
    - secondary:
        provider: azure
        vault: backup-vault-staging-dr
        redundancy: ZRS