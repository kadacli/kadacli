# ── POLICY COMMON ─────────────────────────────────────────────────────────────
# Fields required for every policy regardless of provider.
apiVersion: backupctl/v1                      # required | backupctl/v1
kind: Policy                                  # required | Policy
provider: azure                               # required | azure, aws, gcp, veeam, commvault
metadata:
  name: prod-vm-daily                         # required
  environment: production                     # required | production, staging, development
  timezone: Europe/Stockholm                  # required | IANA timezone string
  owner: ops@company.com                      # required | email
