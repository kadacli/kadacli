# ── POLICY COMMON ─────────────────────────────────────────────────────────────
# Fields required for every policy regardless of provider.
apiVersion: backupctl/v1                      # required | backupctl/v1
kind: Policy                                  # required | Policy
provider: azure                               # required | azure, aws, gcp, veeam, commvault
metadata:
  name: prod-vm-daily                         # required
  environment: production                     # required | production, staging, development
  timezone: Europe/Stockholm                  # required | IANA timezone string
  owner: ops@company.com                      # required | email

# ── AZURE PROVIDER COMMON ─────────────────────────────────────────────────────
# Fields required for every Azure policy regardless of resource type.
resource:
  subscription_id: "00000000-0000-0000-0000-000000000000"  # required | UUID
  type: azure_vm                              # required | azure_vm, azure_disk, azure_sql_vm, azure_sql_db
  vault:
    name: rsv-prod-backup                     # required | 2–50 chars
    resource_group: rg-backup-vault           # required | resource group of the vault

# ── AZURE VM SPECIFIC ─────────────────────────────────────────────────────────
# Fields that only apply to azure_vm policies.
spec:
  instant_rp_retention_days: 2               # required | 1–5
  instant_rp_resource_group_prefix: "rg-instant-"  # optional
  instant_rp_resource_group_suffix: ""              # optional

  retention:
    daily:
      count: 30                              # required | 1–9999
    weekly:                                  # optional
      day: Sunday                            # required if weekly | Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
      count: 12                              # required if weekly | 1–5163
    monthly:                                 # optional
      week: Last                             # required if monthly | First, Second, Third, Fourth, Last
      day: Sunday                            # required if monthly | Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
      count: 12                              # required if monthly | 1–1188
    yearly:                                  # optional
      month: January                         # required if yearly | January, February, March, April, May, June, July, August, September, October, November, December
      week: First                            # required if yearly | First, Second, Third, Fourth, Last
      day: Sunday                            # required if yearly | Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
      count: 3                               # required if yearly | 1–99

  schedule:
    full:
      frequency: daily                       # required | hourly, daily, weekly
      time: "02:00"                          # required | HH:MM (24h UTC)
      # day: Sunday                          # required only when frequency: weekly | Monday–Sunday
