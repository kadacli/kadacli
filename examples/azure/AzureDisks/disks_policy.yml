apiVersion: backupctl/v1
provider: azure
kind: Policy
metadata:
  name: bpac-disk-prod
  environment: production
  timezone: "Europe/Copenhagen"
  owner: devops@company.com
resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  resourceGroup: rg-bpac
  vault: 
    name: backup-vault
    resource_group: rg-bpac
spec:
  # snapshot_resource_group_prefix: "snapshot"
  # snapshot_resource_group_suffix: "rg"
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 1
  schedule:
    frequency: daily
    interval: 12
    time: "04:20"
    