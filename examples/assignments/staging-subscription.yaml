apiVersion: backupctl/v1
kind: Assignment
metadata:
  name: staging-assignments
  subscriptionId: yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy
  environment: staging
  owner: devops@company.com

spec:
  assignments:
    - policy: silver-backup-policy
      targets:
        - type: azure_vm
          resource_group: rg-staging
          resource_name: vm-staging-web-01
          disk_selection: [0]
          include_future_disks: true

        - type: azure_sql
          resource_group: rg-staging
          resource_name: sql-staging-db-01
