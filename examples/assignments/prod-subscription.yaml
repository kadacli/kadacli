apiVersion: backupctl/v1
kind: Assignment
metadata:
  name: production-assignments
  subscriptionId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  environment: production
  owner: devops@company.com

spec:
  assignments:
    - policy: gold-backup-policy
      targets:
        - type: azure_vm
          resource_group: rg-prod
          resource_name: vm-prod-web-01
          disk_selection: [0, 1]
          include_future_disks: true

        - type: azure_vm
          resource_group: rg-prod
          resource_name: vm-prod-web-02
          disk_selection: [0, 1]
          include_future_disks: true

        - type: azure_sql
          resource_group: rg-prod
          resource_name: sql-prod-db-01

        - type: azure_sql_vm
          resource_group: rg-prod
          resource_name: vm-prod-sql-01

        - type: azure_disk
          resource_group: rg-prod
          resource_name: disk-prod-data-01
          overrides:
            retention:
              daily:
                count: 90   # extended retention for critical data disk

    - policy: silver-backup-policy
      targets:
        - type: azure_vm
          resource_group: rg-prod
          resource_name: vm-prod-worker-01
