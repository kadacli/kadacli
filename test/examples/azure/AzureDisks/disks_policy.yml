apiVersion: kadacli/v1
provider: azure
kind: Policy
metadata:
  name: <policy-name>
  environment: <env>
  timezone: "Europe/Copenhagen"
  owner: devops@company.com
resource:
  subscription_id: <subscription-id>
  type: azure_disk
  resourceGroup: rg-bpac
  vault: 
    name: backup-vault  # required
    resource_group: rg-bpac
spec:
  snapshot_resource_group_prefix: "snapshot"
  snapshot_resource_group_suffix: "rg"
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 1
  schedule:
    frequency: daily
    interval: 12
    time: "04:20"
    