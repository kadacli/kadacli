# ── Test matrix case: F11 ────────────────────────────────────
# Expected: FAILS at "validate". schedule.frequency = weekly violates the
# struct tag oneof=hourly daily on AzureDiskSchedule.Frequency. Azure Disk
# Backup has no weekly schedule — only weekly *retention* (see case1).
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case11
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 1
  schedule:
    frequency: weekly
    time: "04:00"
