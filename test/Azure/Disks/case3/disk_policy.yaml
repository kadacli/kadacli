# ── Test matrix case: A3 ─────────────────────────────────────
# Expected: clean create. Same shape as case1 but a longer weekly retention
# (4 weeks = 28 days, inside the operational datastore’s ~30-day ceiling).
# Because this is a distinct policy name, applying it after case1 moves
# datalun2’s backup instance to this policy rather than editing case1’s.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case3
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 4
  schedule:
    frequency: daily
    time: "04:00"
