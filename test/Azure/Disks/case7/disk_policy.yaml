# ── Test matrix case: D7 ─────────────────────────────────────
# Expected: FAILS at "validate". schedule.frequency = daily combined with a
# "daily" retention rule is rejected by validator rule 2 in
# validateAzureDiskRules ("RetentionRule[0] is daily and your backup schedule
# is daily"). No Azure call. case2 is the valid hourly counterpart.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case7
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: daily
        duration: 7
  schedule:
    frequency: daily
    time: "04:00"
