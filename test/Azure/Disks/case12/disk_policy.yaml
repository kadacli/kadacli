# ── Test matrix case: F12 ────────────────────────────────────
# Expected: FAILS at "validate". schedule.interval = 3 violates the struct tag
# oneof=1 2 4 6 8 12. Note the tag is wider than Azure itself, which only
# accepts 4, 6 and 12 hour intervals — 1 and 2 pass validate and are rejected
# at apply (see the gaps section of the README).
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case12
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: daily
        duration: 7
  schedule:
    frequency: hourly
    interval: 3
