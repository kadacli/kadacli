# ── Test matrix case: G15 ────────────────────────────────────
# Expected: passes "validate", FAILS at "diff" and "apply" with
# "rg-bpac/does-not-exist-disk: Disk does not exist". GetDisk runs first in
# both DiffDisk and ApplyDisk, so nothing is written to the vault. The policy
# itself is a valid copy of case1.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case15
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 1
  schedule:
    frequency: daily
    time: "04:00"
