# ── Test matrix case: F14 ────────────────────────────────────
# Expected: FAILS at "validate". retention duration 500 exceeds the max=436
# struct tag on AzureDiskRetentionRule.RetentionDuration. Note 436 is the tag
# ceiling for BOTH daily (days) and weekly (weeks) rules; Azure’s operational
# datastore caps disk snapshots far lower, so values well under 436 can still
# be rejected at apply.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case14
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 500
  schedule:
    frequency: daily
    time: "04:00"
