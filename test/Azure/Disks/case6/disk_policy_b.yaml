# ── Test matrix case: B6 (policy B) ──────────────────────────
# Second, distinct policy in the same directory. Targets "data" and uses a
# different schedule/retention so its apply is clearly attributable to policy
# B, not A.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case6-b
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 3
  schedule:
    frequency: hourly
    interval: 6
