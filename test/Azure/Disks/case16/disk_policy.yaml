# ── Test matrix case: G16 ────────────────────────────────────
# Expected: FAILS at "validate" (resolve step). The policy below is valid, but
# the assignment references "matrix-disk-case16-typo". resolveAzure routes an
# assignment by its FIRST policy reference, so the failure surfaces there as
# "Assignment ...: unknown policy ..." before ResolveDisks is reached.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case16
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 1
  schedule:
    frequency: daily
    time: "04:00"
