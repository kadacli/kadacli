# ── Test matrix case: D8 ─────────────────────────────────────
# Expected: FAILS at "validate". schedule.frequency = hourly with no interval.
# The struct tag is omitempty,oneof=1 2 4 6 8 12, so 0 slips past the tags;
# validator rule 3 catches it and demands an explicit interval.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case8
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: daily
        duration: 7
  schedule:
    frequency: hourly
