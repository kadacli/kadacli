# ── Test matrix case: A1 ─────────────────────────────────────
# Expected: clean create. Baseline — daily schedule + default retention with a
# single weekly rule. Creates the policy definition in the Backup Vault, then
# registers datalun2 as a backup instance pointing at it.
# snapshot_resource_group is omitted throughout this suite, so snapshots land
# in the disk’s own resource group (rg-bpac).
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case1
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 1
  schedule:
    frequency: daily
    time: "04:00"
