# ── Test matrix case: B5 ─────────────────────────────────────
# Expected: clean create on BOTH disks. One policy, two targets (datalun2 and
# data) — the policy definition is upserted once, then each disk is registered
# as its own backup instance against the same policy ID.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case5
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: weekly
        duration: 1
  schedule:
    frequency: daily
    time: "04:00"
