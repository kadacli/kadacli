# ── Test matrix case: A2 ─────────────────────────────────────
# Expected: clean create. Hourly schedule (every 4h) with a daily retention
# rule — hourly is the only frequency that permits a "daily" rule, since
# validator rule 2 rejects daily-schedule + daily-rule (see case7).
# schedule.time must stay unset for hourly (see case9).
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-disk-case2
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_disk
  vault:
    name: backup-vault
    resource_group: rg-bpac

spec:
  retention:
    default: true
    retention_rules:
      - rule: daily
        duration: 7
  schedule:
    frequency: hourly
    interval: 4
