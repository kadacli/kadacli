# ── Test matrix case: A7 ─────────────────────────────────────
# Expected: clean create/update; redundancy=GeoZone drives ApplySqlDbRedundancy.
# Note: GeoZone requires a service tier/region that supports zone-redundant
# *and* geo-replicated storage together — if the target DB's tier doesn't
# support it, expect an Azure-side rejection at apply (not caught locally).
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-sqldb-case7
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_sql_db
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  redundancy: GeoZone
  short_term_retention:
    retention_days: 14
    differential_backup_frequency: 24
