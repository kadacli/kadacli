# ── Test matrix case: B9 ─────────────────────────────────────
# Expected: clean create; single policy fanned out to two targets on two
# different logical servers in one assignment.
apiVersion: backupctl/v1
kind: Policy
provider: azure
metadata:
  name: matrix-sqldb-case9
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_sql_db
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  redundancy: Local
  short_term_retention:
    retention_days: 14
    differential_backup_frequency: 24
