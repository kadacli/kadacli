# ── Test matrix case: G26 (policy 2 of 2, same name) ──────────
# Deliberate duplicate of matrix-sqldb-case26 with a different spec, to trigger
# the duplicate-name guard. The differing redundancy makes it obvious the two
# files are not identical.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-sqldb-case26
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_sql_db
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  redundancy: Zone
  short_term_retention:
    retention_days: 14
    differential_backup_frequency: 24
