# ── Test matrix case: G26 (policy 1 of 2, same name) ──────────
# Expected: FAILS at 'validate' (resolve step). Two policy files in this
# directory share metadata.name "matrix-sqldb-case26". Exercises the
# "duplicate policy name %q" guard in ResolveSQLDBs.
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-sqldb-case26
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_sql_db
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  redundancy: Local
  short_term_retention:
    retention_days: 14
    differential_backup_frequency: 24
