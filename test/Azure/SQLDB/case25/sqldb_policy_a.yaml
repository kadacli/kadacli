# ── Test matrix case: G25 (policy A) ──────────────────────────
# Expected: clean create. Two distinct policies in ONE directory, each with its
# own assignment/target, resolve independently. Policy A targets bpac-sql/prod.
# Confirms multi-policy resolution isolation (all other cases are single-policy;
# case9 is single-policy/two-targets).
apiVersion: backupctl/v1
kind: Policy
provider: azure
metadata:
  name: matrix-sqldb-case25-a
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_sql_db
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  redundancy: Local
  short_term_retention:
    retention_days: 14
    differential_backup_frequency: 24
