apiVersion: backupctl/v1
kind: Assignment
provider: azure
metadata:
  name: matrix-sqldb-case10-assignment
  environment: development
  owner: ops@company.com

assignments:
  - policy: matrix-sqldb-case10
    targets:
      - resource_group: rg-bpac
        server_name: bpac-sql
        resource_name: prod
        overrides:
          short_term_retention:
            retention_days: 30
