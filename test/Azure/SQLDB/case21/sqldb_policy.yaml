# ── Test matrix case: F21 ─────────────────────────────────────
# Expected: FAILS at 'validate'. differential_backup_frequency 6 is not one of
# {12, 24}. Confirms the oneof tag fires for a NON-zero invalid value —
# distinct from case12 (omitted / zero, which skips omitempty and is defaulted
# to 24 by ResolveSQLDBs).
apiVersion: kadacli/v1
kind: Policy
provider: azure
metadata:
  name: matrix-sqldb-case21
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_sql_db
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  redundancy: Local
  short_term_retention:
    retention_days: 14
    differential_backup_frequency: 6
