# ── Test matrix case: G24 ─────────────────────────────────────
# Expected: FAILS at 'validate' (resolve step). The assignment references a
# policy name that does not exist in the directory. Exercises the
# "assignment %q references unknown policy %q" error path in ResolveSQLDBs.
apiVersion: backupctl/v1
kind: Policy
provider: azure
metadata:
  name: matrix-sqldb-case24
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_sql_db
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  redundancy: Local
  short_term_retention:
    retention_days: 14
    differential_backup_frequency: 24
