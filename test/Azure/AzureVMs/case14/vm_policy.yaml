# ── Test matrix case: D19 ─────────────────────────────────────
# Expected: FAILS at 'validate' — retention.yearly requires a weekly or monthly rule to anchor to
apiVersion: backupctl/v1
kind: Policy
provider: azure
metadata:
  name: matrix-case14
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_vm
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  policy_type: Standard
  retention:
    daily:
      count: 20
    yearly:
      month: January
      week: First
      day: Sunday
      count: 10
  schedule:
    full:
      frequency: daily
      time: "02:00"
  instant_rp_retention_days: 5
