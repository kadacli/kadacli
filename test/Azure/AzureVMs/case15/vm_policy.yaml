# ── Test matrix case: D20 ─────────────────────────────────────
# Expected: PASSES 'validate' and 'diff', FAILS at 'apply' — Azure rejects daily retention when backup frequency is weekly (BMSUserErrorInvalidPolicyInput). Known gap: not caught locally.
apiVersion: backupctl/v1
kind: Policy
provider: azure
metadata:
  name: matrix-case15
  environment: development
  timezone: "W. Europe Standard Time"
  owner: ops@company.com

resource:
  subscription_id: "6a0bb3b0-b6fd-4690-94b0-67907ebe1e20"
  type: azure_vm
  vault:
    name: recovery-vault
    resource_group: rg-bpac

spec:
  policy_type: Standard
  retention:
    daily:
      count: 20
    weekly:
      day: Sunday
      count: 100
  schedule:
    full:
      frequency: weekly
      time: "02:00"
      day: Sunday
  instant_rp_retention_days: 5
