apiVersion: backupctl/v1
kind: Assignment
metadata:
  name: prod-vms
  subscriptionId: 00000000-0000-0000-0000-000000000000
  environment: production
  owner: devops@company.com
spec:
  assignments:
    - policy: bpac-vm-prod
      targets:
        - type: azure_vm
          resource_group: rg-my-vms
          resource_name: my-vm-01
          include_future_disks: true
        - type: azure_vm
          resource_group: rg-my-vms
          resource_name: my-vm-02
          include_future_disks: true
          overrides:
            retention:
              daily_count: 60