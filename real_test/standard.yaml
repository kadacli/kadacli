apiVersion: backupctl/v1
kind: Policy
metadata:
  name: bpac-vm-prod
  environment: production
  owner: devops@company.com
spec:
  timezone: "Europe/Copenhagen"
  vault:
    name: recovery-vault
    resource_group: rg-bpac
  instant_rp_retention_days: 2
  instant_rp_resource_group_prefix: "backup"
  instant_rp_resource_group_suffix: "rg"
  retention:
    daily_count: 30
    weekly_count: 12
    weekly_day: "Monday"
    monthly_count: 12
    yearly_count: 5
    yearly_month: "January"
    yearly_day: "Monday"
    yearly_week: "First"
  schedule:
    full:
      frequency: daily
      time: "02:00"