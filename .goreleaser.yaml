# goreleaser configuration for kåda (kada).
# Docs: https://goreleaser.com
version: 2

project_name: kada

before:
  hooks:
    - go mod tidy

builds:
  - id: kada
    main: .
    binary: kada
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: kada
    # Produces e.g. kada_linux_amd64.tar.gz — matches the install URLs in README.md.
    name_template: "kada_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
