apiVersion: backupctl/v1
provider: azure | aws | googleCloud
metadata:
  name: bpac-disk-prod
  environment: production
  timezone: "Europe/Copenhagen"
  owner: devops@company.com
resource:
  resourceKind: IaaSVMSQL | PaaSVM | Disk # resourceKind depends on provider
  vault:
    name: backup-vault1
    resource_group: rg-bpac
spec: # specs depends of resourceKind
  snapshot_resource_group_prefix: "snapshot"
  snapshot_resource_group_suffix: "rg"
  retention:
    operational:
      count: 7
  schedule:
    full:
      frequency: hourly
      interval: 4