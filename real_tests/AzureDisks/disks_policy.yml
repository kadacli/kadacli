apiVersion: backupctl/v1
kind: Policy
metadata:
  name: bpac-disk-prod
  environment: production
  owner: devops@company.com
spec:
  timezone: "Europe/Copenhagen"
  vault:
    name: backup-vault1
    resource_group: rg-bpac
  snapshot_resource_group_prefix: "snapshot"
  snapshot_resource_group_suffix: "rg"
  retention:
    operational:
      count: 7
  schedule:
    full:
      frequency: hourly
      interval: 4