apiVersion: backupctl/v1
provider: azure | aws | googleCloud
metadata:
  name: bpac-disk-prod
  environment: production
  timezone: "Europe/Copenhagen"
  owner: devops@company.com
resource:
  subscriptionId: smth824390
  resourceKind: IaaSVMSQL | PaaSVM | Disk
  resourceGroup: rg-bpac
  vaultName: backup-vault1 | recovery_vault1
spec:
  snapshot_resource_group_prefix: "snapshot"
  snapshot_resource_group_suffix: "rg"
  retention:
    operational:
      count: 7
  schedule:
    full:
      frequency: hourly
      interval: 4