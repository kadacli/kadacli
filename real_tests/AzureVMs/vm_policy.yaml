apiVersion: backupctl/v1
provider: azure | aws | googleCloud
metadata:
  name: bpac-disk-prod
  environment: production
  timezone: "Europe/Copenhagen"
  owner: devops@company.com
resource:
  subscriptionId: smth824390
  resourceKind: IaaSVMSQL | PaaSVM | Disk
  resourceGroup: rg-bpac
  vaultName: backup-vault1 | recovery_vault1
spec:
  instant_rp_retention_days: 2
  instant_rp_resource_group_prefix: "backup"
  instant_rp_resource_group_suffix: "rg"
  retention:
    daily:
      count: 30
    weekly:
      day: Monday
      count: 12
    monthly:
      count: 12
    yearly:
      month: January
      week: First
      day: Monday
      count: 5
  schedule:
    full:
      frequency: daily
      time: "02:00"