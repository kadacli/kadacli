apiVersion: backupctl/v1
provider: azure
metadata:
  name: bpac-disk-prod
  environment: production
  timezone: "Europe/Copenhagen"
  owner: devops@company.com
resource:
  subscription_id: smth824390
  resource_kind: vm
  resource_group: rg-bpac
  vault_name: recovery_vault1
spec:
  instant_rp_retention_days: 2
  instant_rp_resource_group_prefix: "backup"
  instant_rp_resource_group_suffix: "rg"
  retention:
    daily:
      count: 30
    weekly:
      day: Monday
      count: 12
    monthly:
      count: 12
    yearly:
      month: January
      week: First
      day: Monday
      count: 5
  schedule:
    full:
      frequency: daily
      time: "02:00"
  disk_selection:
    mode: include          # Options: all | include | exclude
    luns:
      - 0                  # OS disk
      - 1                  # data disk 1
      - 2                  # data disk 2