apiVersion: backupctl/v1
kind: Policy
metadata:
  name: standard
  environment: production
  owner: devops@company.com

spec:
  timezone: "Europe/Copenhagen"
  vault:
    name: recovery-vault
    resource_group: rg-bpac

  retention:
    daily:
      count: 30
    weekly:
      day: Monday
      count: 12
    monthly:
      count: 12
    yearly:
      count: 5

  schedule:
    full:
      frequency: daily
      time: "02:00"
    differential:
      enabled: true
    log:
      frequency_minutes: 60
